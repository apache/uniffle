rss.rpc.server.port 19999
rss.jetty.http.port 19998
rss.storage.basePath /xxx,/xxx
rss.storage.type MEMORY_LOCALFILE_HDFS
# The remote storage paths that the shuffle server is allowed to access, separated by ','. It's
# required by the storage type with remote storage, and should be set to the same value as
# rss.coordinator.remote.storage.path of the coordinator, e.g.,
# rss.server.remote.storage.allowed.paths hdfs://nameservice1/rss
rss.coordinator.quorum xxx:19999,xxx:19999
rss.server.buffer.capacity 40gb
rss.server.read.buffer.capacity 20gb
rss.server.flush.thread.alive 5
rss.server.flush.localfile.threadPool.size 10
rss.server.flush.hadoop.threadPool.size 60
rss.server.disk.capacity 1t
rss.server.single.buffer.flush.enabled true
rss.server.single.buffer.flush.threshold 128m
